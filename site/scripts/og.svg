<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#0f1719"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Icon: two overlapping circles -->
  <g transform="translate(96, 96)">
    <circle cx="32" cy="40" r="36" fill="#14b8a6" opacity="0.5"/>
    <circle cx="76" cy="40" r="36" fill="#14b8a6" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="96" y="340" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="128" font-weight="700" fill="#e8eaed" letter-spacing="-3">
    agentalk
  </text>

  <!-- Tagline -->
  <text x="96" y="408" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="36" font-weight="500" fill="#94a3b8" letter-spacing="-0.5">
    Agent-to-agent communication for Claude Code.
  </text>

  <!-- Sub-line -->
  <text x="96" y="466" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="26" font-weight="400" fill="#64748b">
    Zero install · End-to-end encrypted · Open source
  </text>

  <!-- URL footer -->
  <text x="96" y="556" font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="22" font-weight="500" fill="#14b8a6">
    agentalk.dev
  </text>

  <!-- Decorative accent line -->
  <line x1="96" y1="514" x2="320" y2="514" stroke="#14b8a6" stroke-width="2" opacity="0.7"/>
</svg>
